name: JS

on:
  push:
    branches: [main]
  # Every pull request, whatever its base, so a PR stacked on a feature branch is checked too.
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  js:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: js

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          package_json_file: js/package.json

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: js/.nvmrc
          cache: pnpm
          cache-dependency-path: js/pnpm-lock.yaml

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint the Session Protocol spec
        run: pnpm lint:spec

      - name: Lint and check formatting
        run: pnpm lint

      # Covers the generated TypeScript and the published docs/session-protocol-reference.html.
      - name: Check generated code and reference is up to date
        run: pnpm generate:check

      # Build first: a workspace package resolves its siblings through their built dist/.
      - name: Build
        run: pnpm build

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Check the API reports are up to date
        run: pnpm api:check

  # The SDK runtime against the real Session Host (`:host`). The host module lands on its own
  # branch, so on a checkout without it this job skips rather than fails.
  contract:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: js

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Look for the host module
        id: host
        working-directory: .
        run: |
          if [ -f host/build.gradle.kts ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::host/ is absent on this branch; the contract tests are skipped"
          fi

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        if: steps.host.outputs.present == 'true'
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4.4.4
        if: steps.host.outputs.present == 'true'

      - name: Build the Session Host
        if: steps.host.outputs.present == 'true'
        working-directory: .
        run: ./gradlew :host:installDist -q --console=plain

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        if: steps.host.outputs.present == 'true'
        with:
          package_json_file: js/package.json

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        if: steps.host.outputs.present == 'true'
        with:
          node-version-file: js/.nvmrc
          cache: pnpm
          cache-dependency-path: js/pnpm-lock.yaml

      - name: Install
        if: steps.host.outputs.present == 'true'
        run: pnpm install --frozen-lockfile

      - name: Build the protocol package
        if: steps.host.outputs.present == 'true'
        run: pnpm --filter @biltorg/pos-protocol build

      - name: Contract tests against the Session Host
        if: steps.host.outputs.present == 'true'
        run: pnpm --filter @biltorg/pos-sdk test:contract

      - name: Emulator smoke test against the Session Host
        if: steps.host.outputs.present == 'true'
        run: pnpm --filter @biltorg/pos-emulator test:contract
