name: Publish to Maven Central

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: namespace-profile-small
    timeout-minutes: 40
    # Repo admins add required reviewers and limit deploys to v* tags on this environment.
    environment: release

    steps:
      - name: Only publish from a release tag
        if: github.event_name == 'workflow_dispatch' && !startsWith(github.ref, 'refs/tags/v')
        env:
          REF: ${{ github.ref }}
        run: |
          echo "::error::Manual publish must run on a v* release tag, not '$REF' — pick the tag in 'Use workflow from'"
          exit 1

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      # gradle.properties VERSION is what ships to Maven Central, so the tag must be v<VERSION>.
      - name: Check the tag matches gradle.properties VERSION
        env:
          REF: ${{ github.ref }}
        run: |
          VERSION="$(grep '^VERSION=' "$GITHUB_WORKSPACE/gradle.properties" | cut -d'=' -f2)"
          if [[ -z "$VERSION" ]]; then
            echo "::error::No VERSION in gradle.properties"
            exit 1
          fi
          if [[ "$REF" != "refs/tags/v$VERSION" ]]; then
            echo "::error::Ref '$REF' does not match gradle.properties VERSION '$VERSION' — tag 'v$VERSION' or bump VERSION first"
            exit 1
          fi

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          # 21 to match build.yml; google-java-format needs it. The SDK still compiles to 11.
          java-version: 21

      - uses: gradle/actions/setup-gradle@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4.4.4

      - name: Publish to Maven Central
        run: ./gradlew publishAndReleaseToMavenCentral
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.GPG_SIGNING_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.GPG_SIGNING_PASSWORD }}
