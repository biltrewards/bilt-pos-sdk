name: Terminal Bridge (macOS)

on:
  push:
    branches: [main]
    paths:
      - 'bridge/**'
      - 'java/**'
      - 'gradle/**'
      - 'gradle.properties'
      - 'settings.gradle.kts'
      - '.github/workflows/bridge-macos.yml'
  pull_request:
    branches: [main]
    paths:
      - 'bridge/**'
      - 'java/**'
      - 'gradle/**'
      - 'gradle.properties'
      - 'settings.gradle.kts'
      - '.github/workflows/bridge-macos.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  package:
    # arm64 runner; an x64 build needs a second job on macos-13 once there is a signing story
    runs-on: macos-14

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Check runner architecture
        run: test "$(uname -m)" = arm64

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4.4.4

      - name: Test
        run: ./gradlew :bridge:test

      # Ad-hoc signed only: no Developer ID or notarization secrets are used here.
      - name: Package
        run: ./gradlew :bridge:jpackage

      - name: Upload dmg
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: bilt-terminal-bridge-macos-arm64
          path: bridge/build/jpackage/*.dmg
          if-no-files-found: error
          retention-days: 14
