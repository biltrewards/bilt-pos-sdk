name: Publish JS packages

# GitHub release -> private Artifact Registry -> scan the tarballs pulled back from
# Artifact Registry -> gated publish to npmjs.com. Artifact Registry does not scan
# standalone npm packages, so the scan here (osv-scanner + npm audit) is the gate.
on:
  release:
    types: [published]

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # id-token: write lets google-github-actions/auth federate the job's OIDC token.
    permissions:
      contents: read
      id-token: write

    defaults:
      run:
        working-directory: js

    env:
      GAR_REGISTRY: //us-central1-npm.pkg.dev/single-scholar-280421/bilt/

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          package_json_file: js/package.json

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: js/.nvmrc
          cache: pnpm
          cache-dependency-path: js/pnpm-lock.yaml

      - name: Install
        run: pnpm install --frozen-lockfile

      # One version source for Maven and npm: gradle.properties VERSION is what the Maven
      # publish ships, so the release tag must equal it (the v prefix is optional).
      # pnpm publish turns the packages' workspace:* dependencies into that version.
      - name: Stamp the version from gradle.properties
        id: version
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          VERSION="$(sed -n 's/^VERSION=//p' "$GITHUB_WORKSPACE/gradle.properties")"
          if [[ -z "$VERSION" ]]; then
            echo "::error::No VERSION in gradle.properties"
            exit 1
          fi
          if [[ "${TAG#v}" != "$VERSION" ]]; then
            echo "::error::Release tag '$TAG' does not match gradle.properties VERSION '$VERSION' — tag 'v$VERSION' or bump VERSION first"
            exit 1
          fi
          pnpm -r --filter './packages/*' exec npm pkg set "version=$VERSION"
          sed -i "s/^export const SDK_VERSION = '.*';/export const SDK_VERSION = '$VERSION';/" "$GITHUB_WORKSPACE/js/packages/sdk/src/core/version.ts"
          grep -q "SDK_VERSION = '$VERSION'" "$GITHUB_WORKSPACE/js/packages/sdk/src/core/version.ts"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Build
        run: pnpm -r build

      # Direct Workload Identity Federation: no service account. The provider only grants
      # trusted refs, which a published release is.
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.GH_ACTIONS_GCP_WORKLOAD_IDENTITY_ID_CICD }}

      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1

      - name: Point @biltorg at Artifact Registry
        run: |
          TOKEN="$(gcloud auth print-access-token)"
          echo "::add-mask::$TOKEN"
          printf '%s:_authToken=%s\n@biltorg:registry=https:%s\n' "$GAR_REGISTRY" "$TOKEN" "$GAR_REGISTRY" >> ~/.npmrc

      # --no-git-checks: the stamped versions leave the tree dirty and a release checks out a tag.
      - name: Publish to Artifact Registry
        run: pnpm -r publish --no-git-checks

      - name: Scan the published tarballs
        run: |
          PACKAGES="$(jq -r 'select(.private != true) | "\(.name)@\(.version)"' "$GITHUB_WORKSPACE"/js/packages/*/package.json | paste -sd, -)"
          export PACKAGES
          "$GITHUB_WORKSPACE/scripts/npm-release-scan.sh" "$RUNNER_TEMP/npm-release"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: npm-tarballs
          path: ${{ runner.temp }}/npm-release/out
          retention-days: 7
          if-no-files-found: error

  # The npmjs environment is where repo admins add required reviewers and limit deploys
  # to v* tags. NPM_TOKEN is only visible to this job, and this job never unpacks or
  # runs package code.
  publish-npmjs:
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: npmjs
    permissions:
      contents: read

    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: npm-tarballs
          path: ${{ runner.temp }}/npm-release/out

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Publish to npmjs
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/npm-release/out"
          published=()
          skipped=()
          while read -r spec tgz; do
            [ -z "$spec" ] && continue
            if [ -n "$(npm view "$spec" version 2>/dev/null || true)" ]; then
              echo "$spec already published, skipping"
              skipped+=("$spec")
              continue
            fi
            if npm publish "$OUT/$tgz" --access public --ignore-scripts; then
              published+=("$spec")
            elif [ -n "$(npm view "$spec" version 2>/dev/null || true)" ]; then
              echo "$spec publish failed but the version is already on npmjs, treating as skipped"
              skipped+=("$spec")
            else
              exit 1
            fi
          done < "$OUT/packages.txt"
          echo "published: ${published[*]:-none}"
          echo "skipped:   ${skipped[*]:-none}"
