name: Require Version Bump

on:
  pull_request:
    branches: [main]
    paths:
      - 'java/**'
      - 'kotlin/**'
      - 'gradle.properties'
      - '!**/*.md'

permissions:
  contents: read

jobs:
  check-version:
    runs-on: namespace-profile-small
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - name: Check version was bumped
        run: |
          PR_VERSION=$(grep '^VERSION=' gradle.properties | cut -d'=' -f2)
          MAIN_VERSION=$(git show origin/main:gradle.properties | grep '^VERSION=' | cut -d'=' -f2)

          echo "PR version:   $PR_VERSION"
          echo "Main version: $MAIN_VERSION"

          if [ "$PR_VERSION" = "$MAIN_VERSION" ]; then
            echo "::error::VERSION in gradle.properties has not been bumped. Please update it before merging."
            exit 1
          fi

          echo "Version bumped from $MAIN_VERSION to $PR_VERSION"
