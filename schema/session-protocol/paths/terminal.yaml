terminal:
  get:
    tags: [Terminal]
    operationId: getTerminal
    summary: The terminal the host drives
    description: |
      A host is a bridge between one register and one terminal, configured when it starts. The
      terminal's address, certificate and payload passphrase are the host's concern and never
      cross this protocol. Answers 404 when the host has no terminal configured.
    responses:
      '200':
        description: The configured terminal.
        content:
          application/json:
            schema:
              $ref: '../components/common.yaml#/TerminalInfo'
      '404':
        $ref: '../openapi.yaml#/components/responses/NoTerminal'

diagnose:
  post:
    tags: [Terminal]
    operationId: diagnoseTerminal
    summary: Query terminal health and host reachability
    description: |
      Mirrors `Terminal.diagnose()`. Terminal operations are session-less and synchronous: the
      request blocks until the terminal answers. They run on the terminal's own exchange, so a
      connectivity check mid-payment does not queue behind the payment.
    parameters:
      - $ref: '#/poiIdParam'
      - $ref: '#/saleIdParam'
    responses:
      '200':
        description: The terminal answered.
        content:
          application/json:
            schema:
              $ref: '../components/common.yaml#/DiagnosisResult'
      '404':
        $ref: '../openapi.yaml#/components/responses/NoTerminal'
      '503':
        $ref: '../openapi.yaml#/components/responses/TerminalUnreachable'

totals:
  post:
    tags: [Terminal]
    operationId: getTerminalTotals
    summary: Running totals since the last reconciliation
    description: |
      Mirrors `Terminal.getTotals()` (Nexo `GetTotals`): lighter than reconciliation, which
      closes the period. Filtered by `saleId` and, when given, `storeLocation` as the
      `TotalsGroupID`.
    parameters:
      - $ref: '#/poiIdParam'
      - $ref: '#/saleIdParam'
      - $ref: '#/storeLocationParam'
    responses:
      '200':
        description: The totals.
        content:
          application/json:
            schema:
              $ref: '../components/common.yaml#/ReconciliationResult'
      '404':
        $ref: '../openapi.yaml#/components/responses/NoTerminal'
      '503':
        $ref: '../openapi.yaml#/components/responses/TerminalUnreachable'

reconcile:
  post:
    tags: [Terminal]
    operationId: reconcileTerminal
    summary: Run a sale reconciliation
    description: Mirrors `Terminal.reconcile()` — end-of-period totals; closes the period.
    parameters:
      - $ref: '#/poiIdParam'
      - $ref: '#/saleIdParam'
      - $ref: '#/storeLocationParam'
    responses:
      '200':
        description: The reconciliation outcome.
        content:
          application/json:
            schema:
              $ref: '../components/common.yaml#/ReconciliationResult'
      '404':
        $ref: '../openapi.yaml#/components/responses/NoTerminal'
      '503':
        $ref: '../openapi.yaml#/components/responses/TerminalUnreachable'

print:
  post:
    tags: [Terminal]
    operationId: printOnTerminal
    summary: Print a document on the terminal printer
    description: Mirrors `Terminal.print(PrintPayload)`.
    parameters:
      - $ref: '#/poiIdParam'
      - $ref: '#/saleIdParam'
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../components/common.yaml#/PrintPayload'
    responses:
      '204':
        description: Printed.
      '400':
        $ref: '../openapi.yaml#/components/responses/BadRequest'
      '404':
        $ref: '../openapi.yaml#/components/responses/NoTerminal'
      '503':
        $ref: '../openapi.yaml#/components/responses/TerminalUnreachable'

sound:
  post:
    tags: [Terminal]
    operationId: terminalSound
    summary: Play or stop a sound on the terminal
    description: Mirrors `Terminal.playSound(..)` and `Terminal.stopSound()`.
    parameters:
      - $ref: '#/poiIdParam'
      - $ref: '#/saleIdParam'
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../components/common.yaml#/SoundRequest'
    responses:
      '204':
        description: Done.
      '400':
        $ref: '../openapi.yaml#/components/responses/BadRequest'
      '404':
        $ref: '../openapi.yaml#/components/responses/NoTerminal'
      '503':
        $ref: '../openapi.yaml#/components/responses/TerminalUnreachable'

poiIdParam:
  name: poiId
  in: query
  required: false
  description: |
    The Nexo `POIID` to send. It does not select a terminal; the host has exactly one and passes
    this value through, using its own default when absent.
  schema:
    type: string

saleIdParam:
  name: saleId
  in: query
  required: false
  description: |
    The register identifier sent as Nexo `SaleID`. Defaults to the host's configured sale id
    for session-less operations.
  schema:
    type: string

storeLocationParam:
  name: storeLocation
  in: query
  required: false
  description: Store location identifier used as the `TotalsGroupID` filter.
  schema:
    type: string
