health:
  get:
    tags: [Health]
    operationId: getHealth
    summary: Host health and capabilities
    description: |
      Unauthenticated. The install prompt in the JavaScript SDK polls this to detect a bridge,
      and every client reads it once to check that the host speaks the protocol version it was
      generated from. `terminal` is the one terminal the host was configured with, absent when
      it has none; `reachable` is a cached view, not a probe — use `POST /v1/terminal/diagnose`
      for a live check.
    security: []
    responses:
      '200':
        description: The host is up.
        content:
          application/json:
            schema:
              $ref: '../components/common.yaml#/Health'
            example:
              host: bridge
              hostVersion: 0.1.0
              sdkVersion: 0.30.0
              protocolVersions: ['2']
              terminal:
                label: Lane 3
                model: VictaLane
                reachable: true
