member:
  parameters:
    - $ref: '../openapi.yaml#/components/parameters/sessionId'
  get:
    tags: [Member]
    operationId: getMember
    summary: The member attached to the visit
    description: |
      Mirrors `ShopperSession.member()`: the member as the POS attached it or as identification
      resolved it, resolved or still pending. Phone numbers, email addresses and custom
      identifiers are masked in every response and event.
    responses:
      '200':
        description: The attached member.
        content:
          application/json:
            schema:
              $ref: '../components/member.yaml#/Member'
      '204':
        description: No member is attached (guest checkout).
      '404':
        $ref: '../openapi.yaml#/components/responses/NotFound'
  put:
    tags: [Member]
    operationId: setMember
    summary: Attach the member for this visit
    description: |
      Mirrors `ShopperSession.member(Member)`. An already-resolved loyalty member id attaches
      immediately as FOUND. Terminal sessions also send AccountNumber/File in a background
      BalanceInquiry and upgrade it with balance, brand and rewards on a FOUND reply.
      NOT_FOUND or SUSPENDED leaves it attached and reports a DECLINED background.error;
      cancellation leaves it unchanged. Local sessions send nothing for a resolved id.
      A resolver attaches as pending and is looked up in the background on the operation
      lane. Terminal lookups always use Keyed: PHONE maps to PhoneNumber, EMAIL and
      ACCOUNT_NUMBER to AccountNumber. Until resolved a pending member is a guest.
      Not found clears a pending member; errors leave it pending. The latest attachment wins.
      Every change is announced through `member.changed`.

      Allowed at any time on both session kinds, but refused (409) once the session has ended
      and on a terminal session while a settlement or void is moving money.
    parameters:
      - $ref: '../openapi.yaml#/components/parameters/idempotencyKey'
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../components/member.yaml#/MemberInput'
    responses:
      '200':
        description: The member as attached (pending until a lookup completes).
        content:
          application/json:
            schema:
              $ref: '../components/member.yaml#/Member'
      '400':
        $ref: '../openapi.yaml#/components/responses/BadRequest'
      '404':
        $ref: '../openapi.yaml#/components/responses/NotFound'
      '409':
        $ref: '../openapi.yaml#/components/responses/Conflict'
      '422':
        $ref: '../openapi.yaml#/components/responses/IdempotencyKeyReused'
  delete:
    tags: [Member]
    operationId: clearMember
    summary: Sign the member out
    description: Mirrors `ShopperSession.member(null)`. Same guards as attaching.
    parameters:
      - $ref: '../openapi.yaml#/components/parameters/idempotencyKey'
    responses:
      '204':
        description: No member is attached any more.
      '404':
        $ref: '../openapi.yaml#/components/responses/NotFound'
      '409':
        $ref: '../openapi.yaml#/components/responses/Conflict'
      '422':
        $ref: '../openapi.yaml#/components/responses/IdempotencyKeyReused'

context:
  parameters:
    - $ref: '../openapi.yaml#/components/parameters/sessionId'
  get:
    tags: [Context]
    operationId: getContext
    summary: The session context
    description: Mirrors `SessionContext.snapshot()`.
    responses:
      '200':
        description: The context as it is now.
        content:
          application/json:
            schema:
              $ref: '../components/session.yaml#/SessionContext'
      '404':
        $ref: '../openapi.yaml#/components/responses/NotFound'
  patch:
    tags: [Context]
    operationId: updateContext
    summary: Move the phase or change attributes
    description: |
      Mirrors `SessionContext.phase(..)`, `attribute(..)` and `removeAttribute(..)`. Pure local
      compute; nothing reaches a terminal. A terminal session moves the phase itself around
      settlement (`TENDERING` when a settlement starts executing, `COMPLETE` when it succeeds,
      back on failure or abort, `SCANNING` when the basket is cleared) and may later override a
      phase set here. Refused (409) once the session is ending or has ended.
    parameters:
      - $ref: '../openapi.yaml#/components/parameters/idempotencyKey'
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../components/session.yaml#/SessionContextPatch'
    responses:
      '200':
        description: The context after the change.
        content:
          application/json:
            schema:
              $ref: '../components/session.yaml#/SessionContext'
      '400':
        $ref: '../openapi.yaml#/components/responses/BadRequest'
      '404':
        $ref: '../openapi.yaml#/components/responses/NotFound'
      '409':
        $ref: '../openapi.yaml#/components/responses/Conflict'
      '422':
        $ref: '../openapi.yaml#/components/responses/IdempotencyKeyReused'
