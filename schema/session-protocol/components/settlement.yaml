SettlementType:
  type: string
  description: |
    How a settlement containing sale, credit and return lines moves money.
    `REFUND_THEN_CHARGE` (the default) executes return refund allocations first, then charges
    sales less credits. `NET` moves only the signed difference: a positive total is charged, a
    negative one refunded, zero sends no monetary movement.
  enum: [REFUND_THEN_CHARGE, NET]

SettlementStep:
  type: string
  description: A step of the settlement sequence.
  enum: [REBATE_REDEMPTION, POINT_REDEMPTION, STORED_VALUE_CHARGE, CARD_CHARGE, EXTERNAL_PAYMENT, STORED_VALUE_LOAD, AWARD, CARD_REFUND, STORED_VALUE_REFUND, EXTERNAL_REFUND, POINT_REDEMPTION_REFUND, REBATE_REFUND, AWARD_REFUND]

SettlementTarget:
  type: object
  description: The basket obligation a settlement instruction or movement resolves.
  required: [type]
  properties:
    type:
      type: string
      enum: [SALES, REFUNDS, BASKET_LINE]
    basketReference:
      type: string
      description: The register reference of the line, for `BASKET_LINE`.

RefundAllocationType:
  type: string
  enum: [CARD, STORED_VALUE, STORE_CREDIT, EXTERNAL, POINT_REDEMPTION, REBATE, AWARD]

RefundAllocation:
  type: object
  description: |
    A register-selected refund or restoration movement for a settlement with returns; one per
    movement the register wants recorded or executed. `CARD` without an original reference is
    an unlinked card refund. `STORED_VALUE`, `POINT_REDEMPTION`, `REBATE` and `AWARD` require
    `originalPoiTransactionId`; the loyalty types also `memberId`; `STORE_CREDIT` requires
    `storedValueCard`. `amount` is positive except for `AWARD`, which is bookkeeping and uses
    zero. `EXTERNAL` counts toward the return total but sends no terminal movement.
  required: [type]
  properties:
    type:
      $ref: '#/RefundAllocationType'
    amount:
      $ref: './common.yaml#/Money'
      default: '0'
    originalPoiTransactionId:
      type: string
    originalPoiTransactionTimestamp:
      type: string
      format: date-time
    storedValueCard:
      $ref: './storedvalue.yaml#/StoredValueCard'
    memberId:
      type: string

StoredValueLoad:
  type: object
  description: Settlement-time stored value fulfillment of a referenced sale line; the card is loaded with the line's pre-discount value.
  required: [basketReference, type, card]
  properties:
    basketReference:
      type: string
      minLength: 1
    type:
      type: string
      enum: [ACTIVATE, RELOAD]
    card:
      $ref: './storedvalue.yaml#/StoredValueCard'

StoredValueLoadRecord:
  type: object
  description: Persistable reference for reversing one fulfilled stored value basket line.
  required: [basketReference, amount, poiTransactionId]
  properties:
    basketReference:
      type: string
    amount:
      $ref: './common.yaml#/Money'
    poiTransactionId:
      type: string
    poiTransactionTimestamp:
      type: string
      format: date-time

ExternalPayment:
  type: object
  description: A payment collected and owned by the register, accepted only as a replacement for a failed final card tender; its amount must equal the outstanding balance.
  required: [tenderType, amount]
  properties:
    tenderType:
      type: string
      minLength: 1
      description: '`"CASH"` or an integrator-defined tender name.'
    amount:
      $ref: './common.yaml#/Money'
    reference:
      type: string
      description: A register transaction reference.

SettlementLoyalty:
  type: object
  description: >-
    Who handles loyalty, mirroring `SettlementLoyalty`. `EXPLICIT` runs the listed SDK loyalty steps
    (all three when `steps` is omitted) and sends the card payment with `LoyaltyHandling=Forbidden`.
    `IMPLICIT` runs no SDK loyalty steps and omits `LoyaltyHandling`, so the terminal handles loyalty
    during the card payment. `FORBIDDEN` runs no loyalty steps and sends `LoyaltyHandling=Forbidden`.
    Omitted, the settlement is `EXPLICIT` with all steps.
  properties:
    handling:
      type: string
      enum: [EXPLICIT, IMPLICIT, FORBIDDEN]
      default: EXPLICIT
    steps:
      type: array
      description: The SDK loyalty steps to run; only with `EXPLICIT`. An empty list is `FORBIDDEN`.
      items:
        type: string
        enum: [REBATES, POINTS, AWARD]

PlannedCardPayment:
  type: object
  description: |
    One planned card payment of a split settlement, mirroring `CardPayment`: a fixed amount
    charged on its own card before the next one. An object rather than a bare amount so a
    planned payment can grow fields.
  required: [amount]
  properties:
    amount:
      description: What this card payment requests; positive.
      $ref: './common.yaml#/Money'

SettlementOptions:
  type: object
  description: The register's plan for resolving a basket, mirroring `SettlementOptions`; all fields optional.
  properties:
    loyalty:
      $ref: '#/SettlementLoyalty'
    cashback:
      description: Positive cashback requested with the card payment. Not allowed together with `cardPayments`.
      $ref: './common.yaml#/Money'
    cardPayments:
      type: array
      description: |
        Splits the card amount into card payments planned up front: each entry is charged in
        order on its own card, and one more card payment for the remainder always follows.
        `[{ "amount": "20.00" }]` charges $20 on the first card and the rest on the next.
        Absent or empty, the settlement makes one card payment for the whole card amount. The
        amounts are checked when the card step starts, after rebates, points and the gift card:
        they must add up to less than the card amount, or the step fails with
        `CARD_PAYMENTS_EXCEED_TOTAL` before any card is charged. Each card payment is its own
        `CARD_CHARGE` step with its own `BEFORE_STEP`, and every one after the first is a nexo
        split payment sent with the first one's sale transaction id. Rejected with 400 together
        with `cashback`.
      items:
        $ref: '#/PlannedCardPayment'
    paymentProcessingDisplay:
      description: Overrides the display shown while the card payment is processing.
      $ref: './display.yaml#/DisplayPayload'
    refunds:
      type: array
      items:
        $ref: '#/RefundAllocation'
    fulfillments:
      type: array
      items:
        $ref: '#/StoredValueLoad'
    settlementType:
      $ref: '#/SettlementType'
      default: REFUND_THEN_CHARGE

SettlementMovement:
  type: object
  description: |
    One money or loyalty movement committed as part of a settlement, or the notice that the
    SDK reversed one (`reversal: true`).

    A reversal notice is sent as an `operation.movement` event, when the `settle` request set
    `reversalNotices`, whenever the settlement itself
    successfully reverses a movement it had already reported: before a `RETRY`, `SKIP` or
    `EXTERNAL` recovery replaces a failed step that had committed (a partial approval the SDK
    can't keep, a handler that threw after the commit, a recovered response that failed
    processing), and once per movement an abort unwinds, newest first. It covers every
    charge-side step (card, stored value, rebates, points, award). It copies the reversed
    movement's `step`, `target`, `amount`, `saleTransactionId`, `memberId` and `points`; its
    `serviceId`, `poiTransactionId` and `poiTransactionTimestamp` are the reversal request's own,
    and `reversedMovement` is the movement it reverses. A reversal that fails gets no notice.
    Notices never appear in `SettlementResult.movements` or `SettlementFailure.committedMovements`:
    the reversed movement leaves the ledger instead.
  required: [step, target, amount]
  properties:
    reversal:
      type: boolean
      default: false
      description: '`true` when this is a reversal notice rather than a movement of its own; absent otherwise.'
    reversedMovement:
      description: 'The movement this notice reverses; present only with `reversal: true`.'
      $ref: '#/SettlementMovement'
    step:
      $ref: '#/SettlementStep'
    target:
      $ref: '#/SettlementTarget'
    amount:
      $ref: './common.yaml#/Money'
    saleTransactionId:
      type: string
    poiTransactionId:
      type: string
    poiTransactionTimestamp:
      type: string
      format: date-time
    memberId:
      type: string
    points:
      type: integer
    pointBalance:
      type: integer
    externalTenderType:
      type: string
    externalReference:
      type: string
    serviceId:
      type: string
      description: The Nexo `ServiceID` of the terminal request that committed the movement, as the step's `BEFORE_STEP` context reported it; absent for movements settled outside the terminal (external payments and refunds).

CommittedStep:
  type: object
  required: [step, success]
  properties:
    step:
      $ref: '#/SettlementStep'
    saleTransactionId:
      type: string
    poiTransactionId:
      type: string
    poiTransactionTimestamp:
      type: string
      format: date-time
    success:
      type: boolean

SettlementContext:
  type: object
  description: What the `beforeStep` handler sees before each payment step.
  required: [step, currentBasket, currentTotal, defaultTransactionId, priorSteps]
  properties:
    step:
      $ref: '#/SettlementStep'
    currentBasket:
      $ref: './basket.yaml#/Basket'
    currentTotal:
      description: Everything the card phase still owes, for a card step; the running total otherwise.
      $ref: './common.yaml#/Money'
    stepAmount:
      description: |
        What this step's terminal request is about to charge: a split card payment's own share,
        while `currentTotal` stays everything the card phase still owes. Equal to `currentTotal`
        for every other step.
      $ref: './common.yaml#/Money'
    defaultTransactionId:
      type: string
      description: |
        The basket's shared sale transaction id, used when the reply names nothing else. For a
        card payment after the first of a split settlement it is the first card payment's id, and
        a different reply is refused with `INVALID_STATE`.
    priorSteps:
      type: array
      items:
        $ref: '#/CommittedStep'
    serviceId:
      type: string
      description: |
        The Nexo `ServiceID` this step's terminal request will be sent with, minted for this
        attempt before the step is asked, so the register can record it before anything is sent.
        A retried step is asked again with a new id. Absent for steps that send no terminal
        request (`EXTERNAL_PAYMENT`, `EXTERNAL_REFUND`).

SettlementFailure:
  type: object
  description: What the `onError` handler sees when a charge-side step failed.
  required: [error, amountDue, committedMovements, outcomeCertainty]
  properties:
    step:
      description: Absent when the failure did not occur inside a specific step (a pre-sequence rejection or refused recovery).
      $ref: '#/SettlementStep'
    error:
      $ref: './common.yaml#/SessionError'
    amountDue:
      description: The amount the failed step was responsible for resolving.
      $ref: './common.yaml#/Money'
    committedMovements:
      type: array
      items:
        $ref: '#/SettlementMovement'
    outcomeCertainty:
      type: string
      description: '`INDETERMINATE` when TransactionStatus could not establish the terminal outcome; skip and external replacement are then invalid.'
      enum: [DEFINITIVE, INDETERMINATE]
    messageCategory:
      type: string
    serviceId:
      type: string

SettlementRecovery:
  type: object
  description: |
    The register's answer to a `RECOVERY_REQUIRED` step. `RETRY` retries only the failed step
    (for an indeterminate failure it checks TransactionStatus again and never resends);
    `SKIP` skips an optional step (never the final card tender or a fulfillment); `EXTERNAL`
    records `externalPayment` for the outstanding balance and continues; `ABORT` unwinds the
    committed charge-side steps and fails the settlement; `ABANDON` stops recovery and hands
    the partial settlement to the register as an `AbandonedSettlementRecord`.
  required: [action]
  properties:
    action:
      type: string
      enum: [RETRY, SKIP, EXTERNAL, ABORT, ABANDON]
    externalPayment:
      description: Required for `EXTERNAL`.
      $ref: '#/ExternalPayment'

PartialCardApproval:
  type: object
  description: |
    What `onPartialCardApproval` sees, mirroring `PartialCardApproval`: a card payment the
    terminal approved for less than it requested. By then the payment's movement has been
    published. The `PARTIAL_CARD_APPROVAL` step carries these fields.
  required: [approved, requested, shortfall, amountDue, cardPayments, movement]
  properties:
    approved:
      description: What the terminal authorized for this card payment.
      $ref: './common.yaml#/Money'
    requested:
      description: What this card payment asked for.
      $ref: './common.yaml#/Money'
    shortfall:
      description: '`requested` minus `approved`.'
      $ref: './common.yaml#/Money'
    amountDue:
      description: |
        Everything the card phase still owes after this payment: the shortfall plus the card
        payments still to come. An `EXTERNAL` decision must pay exactly this amount.
      $ref: './common.yaml#/Money'
    cardPayments:
      type: array
      description: The card payments committed so far, in order, this partial one last. Count them to cap how many cards a sale takes.
      items:
        $ref: '#/CardPaymentResult'
    movement:
      description: The `CARD_CHARGE` movement of this partial card payment.
      $ref: '#/SettlementMovement'

PartialApprovalDecision:
  type: object
  description: |
    The register's answer to a `PARTIAL_CARD_APPROVAL` step, mirroring `PartialApprovalDecision`.
    The partial card payment stays committed unless the action is `ABORT`. `ANOTHER_CARD` charges
    the shortfall on another card, then continues the plan. `ADD_TO_NEXT` adds the shortfall to
    the next card payment, and is refused while none is left. `EXTERNAL` records
    `externalPayment` for everything the card phase still owes (`amountDue` of the step) and ends
    the card phase, keeping every card payment. `ABORT` reverses every committed charge-side step
    and fails the settlement as `DECLINED`. A decision the settlement cannot carry out
    (`ADD_TO_NEXT` with no card payment left, an `EXTERNAL` amount other than `amountDue`) is
    refused as an invalid `SettlementRecovery` is: the settlement fails with `INVALID_STATE`,
    with the committed steps left standing for `voidTransaction`.
  required: [action]
  properties:
    action:
      type: string
      enum: [ANOTHER_CARD, ADD_TO_NEXT, EXTERNAL, ABORT]
    externalPayment:
      description: Required for `EXTERNAL`.
      $ref: '#/ExternalPayment'

AbandonedSettlementRecord:
  type: object
  description: The manual-takeover record produced when the register abandons recovery; every committed movement becomes its reconciliation responsibility.
  required: [settlementId, abandonedAt, basket, options, failure, outstandingAmount, committedMovements]
  properties:
    settlementId:
      type: string
    abandonedAt:
      type: string
      format: date-time
    basket:
      $ref: './basket.yaml#/Basket'
    options:
      $ref: '#/SettlementOptions'
    memberId:
      type: string
    failure:
      $ref: '#/SettlementFailure'
    outstandingAmount:
      $ref: './common.yaml#/Money'
    committedMovements:
      type: array
      items:
        $ref: '#/SettlementMovement'

CardPaymentRecord:
  type: object
  description: Persistable reference for voiding or refunding one card payment of an original sale.
  required: [poiTransactionId]
  properties:
    poiTransactionId:
      type: string
    poiTransactionTimestamp:
      type: string
      format: date-time
    amount:
      description: What the payment authorized; absent when only its reference was kept.
      $ref: './common.yaml#/Money'

OriginalSaleRecord:
  type: object
  description: |
    References from a completed sale that a later session uses to void the whole transaction or
    allocate return settlement. A sale may hold several card payments: `cardPayments` lists them
    in the order they were made, and when it is non-empty it takes precedence over
    `cardPoiTransactionId` and `cardPoiTransactionTimestamp`. Those single-card fields, kept for
    compatibility, are read when `cardPayments` is absent or empty and stand for one card payment.
  properties:
    cardPayments:
      type: array
      items:
        $ref: '#/CardPaymentRecord'
    cardPoiTransactionId:
      type: string
      description: The first card payment's reference. Ignored when `cardPayments` is non-empty.
    cardPoiTransactionTimestamp:
      type: string
      format: date-time
      description: The first card payment's timestamp. Ignored when `cardPayments` is non-empty.
    storedValuePoiTransactionId:
      type: string
    storedValuePoiTransactionTimestamp:
      type: string
      format: date-time
    storedValueLoads:
      type: array
      items:
        $ref: '#/StoredValueLoadRecord'
    rebatePoiTransactionId:
      type: string
    rebatePoiTransactionTimestamp:
      type: string
      format: date-time
    redemptionPoiTransactionId:
      type: string
    redemptionPoiTransactionTimestamp:
      type: string
      format: date-time
    awardPoiTransactionId:
      type: string
    awardPoiTransactionTimestamp:
      type: string
      format: date-time
    memberId:
      type: string

RedeemedRebate:
  type: object
  required: [amount]
  properties:
    itemId:
      type: string
      description: The basket line the rebate applies to; absent for cart-level.
    sku:
      type: string
    amount:
      $ref: './common.yaml#/Money'
    label:
      type: string
    promotionRef:
      type: string

EarnedReward:
  type: object
  required: [quantity]
  properties:
    type:
      type: string
      enum: [REWARD, COUPON, POINT]
    description:
      type: string
    quantity:
      type: integer
    rewardRef:
      type: string

RebateRedemptionResult:
  type: object
  description: What `onRebatesRedeemed` sees; the reply's `total` is the running total for the next step, typically `suggestedTotal`.
  required: [rebates, totalRebateAmount, previousTotal, suggestedTotal, updatedBasket]
  properties:
    rebates:
      type: array
      items:
        $ref: '#/RedeemedRebate'
    totalRebateAmount:
      $ref: './common.yaml#/Money'
    previousTotal:
      $ref: './common.yaml#/Money'
    suggestedTotal:
      description: '`previousTotal − totalRebateAmount`.'
      $ref: './common.yaml#/Money'
    updatedBasket:
      $ref: './basket.yaml#/Basket'

PointRedemptionResult:
  type: object
  required: [pointsUsed, monetaryValue, previousTotal, suggestedTotal, remainingPointBalance]
  properties:
    pointsUsed:
      type: integer
    monetaryValue:
      $ref: './common.yaml#/Money'
    previousTotal:
      $ref: './common.yaml#/Money'
    suggestedTotal:
      $ref: './common.yaml#/Money'
    remainingPointBalance:
      type: integer

GiftCardPaymentResult:
  type: object
  description: What `onGiftCardPayment` sees. With an insufficient balance the charge is partial and `suggestedTotal` carries the remainder for the card step.
  required: [amountCharged, previousTotal, suggestedTotal]
  properties:
    amountCharged:
      $ref: './common.yaml#/Money'
    remainingCardBalance:
      $ref: './common.yaml#/Money'
    previousTotal:
      $ref: './common.yaml#/Money'
    suggestedTotal:
      $ref: './common.yaml#/Money'

CardPaymentResult:
  type: object
  description: One card payment a settlement made. Each reference is absent when the terminal did not report it.
  required: [amount, partialApproval]
  properties:
    amount:
      description: What the terminal authorized for this payment, cashback included.
      $ref: './common.yaml#/Money'
    poiTransactionId:
      type: string
      description: Terminal reference of this payment, for void and refund.
    poiTransactionTimestamp:
      type: string
      format: date-time
    approvalCode:
      type: string
    acquirerTransactionId:
      type: string
    paymentBrand:
      type: string
    maskedPan:
      type: string
    customerReceipt:
      $ref: './common.yaml#/Receipt'
    merchantReceipt:
      $ref: './common.yaml#/Receipt'
    partialApproval:
      type: boolean
      description: Whether the terminal authorized less than this payment requested.

SettlementResult:
  type: object
  description: |
    Final outcome of a successful settlement. `movements` is the authoritative ledger of what
    remained committed; movement events during the run are provisional. The loyalty award is
    best-effort: a failed award does not fail the checkout and is reported in `warnings`.

    A settlement may make several card payments: `cardPayments` lists them in order. The
    single-payment fields (`poiTransactionId`, `approvalCode`, `customerReceipt` and the like)
    describe the first one; where its response lacks a value they keep the stored value
    payment's, and a gift-card-only sale reports its stored value payment there.
  required: [success, finalBasket, authorizedAmount, storedValueAmountUsed, storedValueLoadedAmount, cardAmountCharged, cardPayments, externalPaymentAmount, redeemedRebates, totalRebateAmount, pointsRedeemed, pointsMonetaryValue, earnedRewards, totalPointsEarned, pointsBalance, promotionMessages, cardRefundedAmount, storedValueRefundedAmount, externalRefundedAmount, loyaltyRefundedAmount, movements, warnings]
  properties:
    success:
      type: boolean
    finalBasket:
      $ref: './basket.yaml#/Basket'
    authorizedAmount:
      $ref: './common.yaml#/Money'
    storedValueAmountUsed:
      $ref: './common.yaml#/Money'
    storedValueLoadedAmount:
      $ref: './common.yaml#/Money'
    cardAmountCharged:
      description: The sum of `cardPayments`.
      $ref: './common.yaml#/Money'
    cardPayments:
      type: array
      description: Every card payment the settlement made and kept, in order; empty when no card was charged.
      items:
        $ref: '#/CardPaymentResult'
    externalPaymentAmount:
      $ref: './common.yaml#/Money'
    approvalCode:
      type: string
      description: The first card payment's.
    acquirerTransactionId:
      type: string
      description: The first card payment's.
    paymentBrand:
      type: string
      description: The first card payment's.
    redeemedRebates:
      type: array
      items:
        $ref: '#/RedeemedRebate'
    totalRebateAmount:
      $ref: './common.yaml#/Money'
    pointsRedeemed:
      type: integer
    pointsMonetaryValue:
      $ref: './common.yaml#/Money'
    earnedRewards:
      type: array
      items:
        $ref: '#/EarnedReward'
    totalPointsEarned:
      type: integer
    pointsBalance:
      type: integer
    promotionMessages:
      type: array
      items:
        type: string
    customerReceipt:
      $ref: './common.yaml#/Receipt'
    merchantReceipt:
      $ref: './common.yaml#/Receipt'
    poiTransactionId:
      type: string
      description: Terminal reference of the first card payment, for void and refund; a gift-card-only sale reports its stored value payment here.
    poiTransactionTimestamp:
      type: string
      format: date-time
    storedValuePoiTransactionId:
      type: string
    storedValuePoiTransactionTimestamp:
      type: string
      format: date-time
    awardPoiTransactionId:
      type: string
    awardPoiTransactionTimestamp:
      type: string
      format: date-time
    rebatePoiTransactionId:
      type: string
    rebatePoiTransactionTimestamp:
      type: string
      format: date-time
    redemptionPoiTransactionId:
      type: string
    redemptionPoiTransactionTimestamp:
      type: string
      format: date-time
    cardRefundedAmount:
      $ref: './common.yaml#/Money'
    storedValueRefundedAmount:
      $ref: './common.yaml#/Money'
    externalRefundedAmount:
      $ref: './common.yaml#/Money'
    loyaltyRefundedAmount:
      $ref: './common.yaml#/Money'
    movements:
      type: array
      items:
        $ref: '#/SettlementMovement'
    warnings:
      type: array
      items:
        type: string
