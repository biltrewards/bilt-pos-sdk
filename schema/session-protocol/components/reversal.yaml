ReversalStep:
  type: string
  description: |
    One reversible leg of a sale. A void reverses the known legs in this order:
    `STORED_VALUE_LOAD`, `CARD`, `STORED_VALUE`, `REDEMPTION`, `REBATE`, `AWARD`. A refund flow
    has at most `CARD` (the tender refund) and `AWARD`.
  enum: [STORED_VALUE_LOAD, CARD, STORED_VALUE, REDEMPTION, REBATE, AWARD]

ReversalDecision:
  type: string
  description: |
    How a reversal proceeds after a step failed. `RETRY` re-sends the step; `SKIP` leaves the
    movement standing and continues (a void then fails as incomplete when a money leg was
    skipped; a refund's tender step may be skipped outright and the sale stays voidable);
    `ABORT` stops, with already-reversed steps standing so the operation can be retried.
  enum: [RETRY, SKIP, ABORT]

ReversalContext:
  type: object
  description: What a refund's or void's `BEFORE_STEP` handler sees before each leg is sent.
  required: [step, serviceId]
  properties:
    step:
      $ref: '#/ReversalStep'
    serviceId:
      type: string
      description: The Nexo `ServiceID` this leg's terminal request will be sent with, minted for this attempt; a retried leg is asked again with a new id.

ReversedMovement:
  type: object
  description: A movement that completed before a whole-sale void stopped.
  required: [step, poiTransactionId]
  properties:
    step:
      $ref: '#/ReversalStep'
    poiTransactionId:
      type: string
    serviceId:
      type: string
      description: The Nexo `ServiceID` of the reversal request that reversed the movement, as its `BEFORE_STEP` context reported it.

TenderType:
  type: string
  description: The money tender a reversal or refund returned funds to. Loyalty movements are not tenders. Voids and session refunds never return to `EXTERNAL`.
  enum: [CARD, STORED_VALUE, EXTERNAL]

TenderAmount:
  type: object
  description: The amount one tender leg of a void or refund returned. Each card payment is its own entry.
  required: [tender]
  properties:
    tender:
      $ref: '#/TenderType'
    poiTransactionId:
      type: string
      description: The original POI transaction reversed or refunded; absent for an external tender or an unlinked refund.
    amount:
      description: Absent when the terminal did not report it and the original payment's amount is unknown.
      $ref: './common.yaml#/Money'

TenderMovement:
  type: object
  description: One tender leg (a card payment or a stored value payment) a void reversed or a refund returned, with the terminal's own reference and receipts for it.
  required: [tenderType]
  properties:
    tenderType:
      $ref: '#/TenderType'
    originalPoiTransactionId:
      type: string
      description: The payment's POI transaction this reversed or refunded; absent for an unlinked refund.
    amount:
      description: Absent when the terminal did not report it and the original payment's amount is unknown.
      $ref: './common.yaml#/Money'
    poiTransactionId:
      type: string
      description: Terminal reference of the reversal or refund itself.
    poiTransactionTimestamp:
      type: string
      format: date-time
    approvalCode:
      type: string
      description: A refund's approval code; absent for a reversal.
    serviceId:
      type: string
      description: The Nexo `ServiceID` the reversal or refund request was sent with.
    customerReceipt:
      $ref: './common.yaml#/Receipt'
    merchantReceipt:
      $ref: './common.yaml#/Receipt'

RefundResult:
  type: object
  description: |
    Outcome of a refund. A linked refund also reverses loyalty points awarded on the original
    transaction, best-effort. A refund of a sale with several card payments sends one refund per
    card payment: `cardRefunds` lists each with its receipts, and `refundedAmountByTender` breaks
    `refundedAmount` down. The single-value fields describe the first refund sent.
  required: [success, cardRefunds, refundedAmountByTender, pointsReversed, remainingPointBalance]
  properties:
    success:
      type: boolean
    refundedAmount:
      description: The sum of `refundedAmountByTender`. Absent when any refund's amount is unknown.
      $ref: './common.yaml#/Money'
    cardRefunds:
      type: array
      description: Every card payment this call refunded, in the order sent (newest first). Every entry's `tenderType` is `CARD`.
      items:
        $ref: '#/TenderMovement'
    refundedAmountByTender:
      type: array
      description: The amount each tender leg returned, in the order sent; the entries sum to `refundedAmount`.
      items:
        $ref: '#/TenderAmount'
    approvalCode:
      type: string
    poiTransactionId:
      type: string
    poiTransactionTimestamp:
      type: string
      format: date-time
    customerReceipt:
      $ref: './common.yaml#/Receipt'
    merchantReceipt:
      $ref: './common.yaml#/Receipt'
    pointsReversed:
      type: integer
      description: '`0` for unlinked.'
    remainingPointBalance:
      type: integer

VoidResult:
  type: object
  description: |
    Outcome of `voidTransaction`: the movements *this call* reversed. A resumed void after a
    partial abort does not restate what earlier attempts reversed; its amount, reference and
    receipts cover only the legs sent this time and may all be absent. `cardReversals` lists each
    card payment reversed with its receipts, and `reversedAmountByTender` breaks the money tender
    legs down; the single-value fields describe the first leg sent (the newest card payment).
  required: [success, cardReversals, reversedAmountByTender, pointsReversed, remainingPointBalance]
  properties:
    success:
      type: boolean
    reversedAmount:
      description: |
        When any tender leg was reversed, the sum of `reversedAmountByTender`, absent when a leg's
        amount is unknown. A void with no tender leg reports the value of the loyalty or stored
        value load reversals.
      $ref: './common.yaml#/Money'
    cardReversals:
      type: array
      description: Every card payment this call reversed, in the order sent (newest first). Every entry's `tenderType` is `CARD`.
      items:
        $ref: '#/TenderMovement'
    storedValueReversal:
      description: The stored value (gift card) payment this call reversed, with its receipts; absent when it reversed none. A sale has at most one.
      $ref: '#/TenderMovement'
    reversedAmountByTender:
      type: array
      description: The amount each money tender leg returned, in the order sent. Loyalty reversals are not listed.
      items:
        $ref: '#/TenderAmount'
    poiTransactionId:
      type: string
    poiTransactionTimestamp:
      type: string
      format: date-time
    customerReceipt:
      $ref: './common.yaml#/Receipt'
    merchantReceipt:
      $ref: './common.yaml#/Receipt'
    pointsReversed:
      type: integer
    remainingPointBalance:
      type: integer

MessageCategory:
  type: string
  description: The Nexo `MessageCategoryType`.
  enum: [ABORT, ADMIN, BALANCE_INQUIRY, BATCH, CARD_ACQUISITION, CARD_READER_APDU, CARD_READER_INIT, CARD_READER_POWER_OFF, DIAGNOSIS, DISPLAY, ENABLE_SERVICE, EVENT, GET_TOTALS, INPUT, INPUT_UPDATE, LOGIN, LOGOUT, LOYALTY, PAYMENT, PIN, PRINT, RECONCILIATION, REVERSAL, SOUND, STORED_VALUE, TRANSACTION_STATUS, TRANSMIT]

TransactionStatusOptions:
  type: object
  description: By default the referenced request is assumed to be a payment and no receipt data is requested.
  properties:
    originalCategory:
      $ref: '#/MessageCategory'
      default: PAYMENT
    originalSaleId:
      type: string
      minLength: 1
      description: The `saleId` the original request was sent with, when it differs from this session's (another lane, or a restart under a new `saleId`). Nexo requires it whenever the status is not asked by the Sale Terminal that sent the original. Defaults to this session's `saleId`.
    receiptReprint:
      type: boolean
      default: false
      description: Whether the terminal should include the original receipts, to reprint after a crash or connection loss.
    documentQualifiers:
      type: array
      description: Receipt kinds to include when reprinting; defaults to customer and cashier receipts.
      items:
        $ref: './common.yaml#/DocumentQualifier'

TransactionStatusResult:
  type: object
  description: |
    When the original transaction was found the terminal repeats its response; exactly one of
    the typed responses is present, as `messageCategory` indicates. The responses are Nexo
    structures carried through unchanged.
  required: [found]
  properties:
    found:
      type: boolean
    messageCategory:
      type: string
      description: '`"Payment"`, `"Loyalty"`, `"StoredValue"` or `"Reversal"`.'
    paymentResponse:
      $ref: './common.yaml#/NexoObject'
    loyaltyResponse:
      $ref: './common.yaml#/NexoObject'
    storedValueResponse:
      $ref: './common.yaml#/NexoObject'
    reversalResponse:
      $ref: './common.yaml#/NexoObject'
