MediaType:
  type: string
  description: The kinds of media a surface may be asked to draw; `HTML` only on web-capable surfaces.
  enum: [IMAGE, VIDEO, HTML]

SurfaceKind:
  type: string
  description: How a placement is drawn, reported to the ad platform so it serves what the surface can do justice to.
  enum: [NATIVE, WEB, TERMINAL, HANDOFF, HOSTED]

Action:
  type: string
  description: What a call to action asks for. Every action is validated by the host against the ad platform before anything happens.
  enum: [APPLY_OFFER, SEND_TO_PHONE, DETAILS, DISMISS]

ClientCapabilities:
  type: object
  description: What the client can render, folded into the `Capabilities` the host sends with every ad decision.
  required: [formats, surfaceKind]
  properties:
    formats:
      type: array
      items:
        $ref: '#/MediaType'
    surfaceKind:
      $ref: '#/SurfaceKind'
    actions:
      type: array
      description: |
        Calls to action the client handles. Accepted and ignored: the Java SDK's `Surface` has no
        counterpart, so the host still offers every action and the client decides which to render.
      items:
        $ref: '#/Action'

PlacementConfig:
  type: object
  description: A named zone the client has a surface for; `surfaceKind` and `formats` default to the session's `clientCapabilities`.
  required: [id]
  properties:
    id:
      type: string
      minLength: 1
      description: The platform's placement id, e.g. `lane-banner`.
    surfaceKind:
      $ref: '#/SurfaceKind'
    formats:
      type: array
      items:
        $ref: '#/MediaType'

WidgetConfig:
  type: object
  description: The `RetailMedia.builder()` options the client may set; the host supplies the ad decision service and credentials.
  required: [type, placements]
  properties:
    type:
      type: string
      enum: [retail-media]
    placements:
      type: array
      minItems: 1
      items:
        $ref: '#/PlacementConfig'
    eligiblePhases:
      type: array
      description: Phases in which media is requested and shown; default every phase except `COMPLETE`.
      items:
        $ref: './session.yaml#/CheckoutPhase'
    decisionTimeout:
      description: How long a decision may take before the placement stays blank; default `PT0.5S`.
      $ref: './common.yaml#/Duration'
    renderingTtl:
      description: Overrides how long a rendering stays before refresh; default each rendering's own TTL.
      $ref: './common.yaml#/Duration'

WidgetState:
  type: object
  required: [type, paused, placements]
  properties:
    type:
      type: string
      enum: [retail-media]
    paused:
      type: boolean
    placements:
      type: array
      items:
        $ref: '#/PlacementConfig'
    inert:
      type: boolean
      description: '`true` when the widget failed to attach and runs no decisions this session; `error` says why.'
    error:
      $ref: './common.yaml#/SessionError'

MediaSpec:
  type: object
  description: The media asset of a rendering; URLs are signed, short-lived CDN links.
  required: [type, url]
  properties:
    type:
      $ref: '#/MediaType'
    url:
      type: string
      format: uri
    duration:
      description: Running time of a video.
      $ref: './common.yaml#/Duration'
    poster:
      type: string
      format: uri
      description: Still frame to show before a video starts.

Cta:
  type: object
  description: A call to action; the `token` is opaque, minted per creative and session, and must be handed back exactly as received.
  required: [label, action, token]
  properties:
    label:
      type: string
    action:
      $ref: '#/Action'
    token:
      type: string
      minLength: 1

Rendering:
  type: object
  description: |
    A structured creative ready to be drawn: media, copy, up to two calls to action, a TTL and
    tracking beacons. Carries no PII. A client still showing a rendering past its TTL should
    expect a replacement or a `widget.clear` and must not act on its CTAs afterwards.
  required: [creativeId, placement, media, headline, ttl, tracking]
  properties:
    creativeId:
      type: string
    placement:
      type: string
    media:
      $ref: '#/MediaSpec'
    headline:
      type: string
    body:
      type: string
    cta:
      $ref: '#/Cta'
    secondary:
      $ref: '#/Cta'
    ttl:
      $ref: './common.yaml#/Duration'
    tracking:
      type: object
      description: Beacons keyed by event name, e.g. `impression`, `viewability`.
      additionalProperties:
        type: string
        format: uri

Offer:
  type: object
  description: |
    A price action the ad platform validated for this checkout: exactly one of `amount` or
    `percentage` off, applying to the basket or to one SKU. How the register realises it is its
    choice; the creative's copy is never trusted for pricing.
  required: [id, scope, creativeId]
  properties:
    id:
      type: string
    scope:
      type: string
      enum: [BASKET, LINE_ITEM]
    sku:
      type: string
      description: Required for `LINE_ITEM`.
    amount:
      $ref: './common.yaml#/Money'
    percentage:
      description: '`0 < p <= 100`.'
      $ref: './common.yaml#/Money'
    expiry:
      type: string
      format: date-time
    creativeId:
      type: string

AdInteraction:
  type: object
  description: One thing the shopper did with a creative, as reported to the ad platform. Informational.
  required: [creativeId, placement, kind, timestamp]
  properties:
    creativeId:
      type: string
    placement:
      type: string
    kind:
      type: string
      enum: [SHOWN, VIEWED, TAPPED, CTA_ACCEPTED, SEND_TO_PHONE_REQUESTED, DISMISSED, COMPLETED]
    timestamp:
      type: string
      format: date-time
    action:
      description: The call to action involved, for tap-driven kinds.
      $ref: '#/Action'

WidgetAction:
  type: object
  description: |
    The client's report of a shopper interaction with a rendering (`ActionSink`). `perform`
    needs `token` (and the CTA's `action` when known, for cross-checking); the other kinds name
    the rendering by `creativeId` and `placement` alone.
  required: [kind, creativeId, placement]
  properties:
    kind:
      type: string
      enum: [perform, viewed, dismissed, completed]
    creativeId:
      type: string
    placement:
      type: string
    action:
      $ref: '#/Action'
    token:
      type: string
