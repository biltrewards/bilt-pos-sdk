  /v1/sessions/{sessionId}/operations/{operationId}/abort:
    $ref: './paths/operations.yaml#/abort'
  /v1/sessions/{sessionId}/widgets:
    $ref: './paths/widgets.yaml#/widgets'
  /v1/sessions/{sessionId}/widgets/{widgetType}/pause:
    $ref: './paths/widgets.yaml#/pause'
  /v1/sessions/{sessionId}/widgets/{widgetType}/resume:
    $ref: './paths/widgets.yaml#/resume'
  /v1/sessions/{sessionId}/widgets/retail-media/actions:
    $ref: './paths/widgets.yaml#/retailMediaActions'
  /v1/sessions/{sessionId}/events:
    $ref: './paths/events.yaml#/events'
components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
      description: Reserved for paired-origin tokens; not enforced by development-mode hosts.
  parameters:
    sessionId:
      name: sessionId
      in: path
      required: true
      description: The session's identifier, as `Session.id` reports it.
      schema:
        type: string
    operationId:
      name: operationId
      in: path
      required: true
      description: The operation's identifier, as `Operation.id` reports it.
      schema:
        type: string
    idempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: |
        A client-generated key, unique per intended request (a UUID). The host remembers the
        key for the life of the session and answers a replay with the original response. The
        same key with a different body is refused with 422 (`VALIDATION`). Required on every
        POST, PUT, PATCH and DELETE under `/v1/sessions`, because a browser may retry after a
        dropped connection and money may have moved.
      schema:
        type: string
        minLength: 1
        maxLength: 128
  responses:
    BadRequest:
      description: The request did not validate.
      content:
        application/json:
          schema:
            $ref: './components/common.yaml#/SessionError'
    NotFound:
      description: No such session, operation, item or widget.
      content:
        application/json:
          schema:
            $ref: './components/common.yaml#/SessionError'
    NoTerminal:
      description: The host has no terminal configured.
      content:
        application/json:
          schema:
            $ref: './components/common.yaml#/SessionError'
    Conflict:
      description: Refused by a lifecycle guard; the body says which.
      content:
        application/json:
          schema:
            $ref: './components/common.yaml#/SessionError'
    IdempotencyKeyReused:
      description: The `Idempotency-Key` was already used for a different request (`VALIDATION`).
      content:
        application/json:
          schema:
            $ref: './components/common.yaml#/SessionError'
    TerminalUnreachable:
      description: The host could not reach the terminal.
      content:
        application/json:
          schema:
            $ref: './components/common.yaml#/SessionError'
  schemas:
    SessionError:
      $ref: './components/common.yaml#/SessionError'
    SessionErrorCode:
      $ref: './components/common.yaml#/SessionErrorCode'
    Money:
      $ref: './components/common.yaml#/Money'
    Duration:
      $ref: './components/common.yaml#/Duration'
    Health:
