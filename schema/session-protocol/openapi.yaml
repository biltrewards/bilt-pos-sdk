openapi: 3.1.0
info:
  title: Bilt POS Session Protocol
  version: 2.0.0-draft
  summary: The wire form of the Bilt POS SDK's ShopperSession API.
  description: |
    The Session Protocol is how a register that cannot embed the Java SDK — a browser page, a
    React Native app, any non-JVM language — drives a Bilt terminal. A **host** runs the Java SDK's
    settlement engine and exposes it over HTTP and a per-session event stream; the register is a
    thin client. Two hosts speak it: the **Terminal Bridge** (a desktop application on the register
    machine, loopback only) and, later, the **Cloud Session Service**. This revision describes the
    bridge in development mode: no pairing, no authentication, no cloud configuration.

    The protocol speaks the SDK's `ShopperSession` vocabulary and nothing else. Nothing from the
    Nexo Sale to POI protocol leaks except where the Java API itself hands back a Nexo structure
    (transaction status replays, diagnosis status, PIN blocks); those cross as opaque JSON.

    ## Principles

    * **A session is a resource.** Create it, mutate its basket, member and context, run
      operations against it, end it.
    * **Lazy operations become requests.** Everything that is a `SessionResult`,
      `SettlementFlow` or `ReversalFlow` in Java is `POST /v1/sessions/{id}/operations`,
      returning an operation resource with a status. Clients normally watch the event stream and
      may poll.
    * **Register callbacks become steps.** Where Java blocks the settlement thread on a register
      handler (the running total after rebates, the recovery decision after a failed charge), the
      host emits an `operation.step` event with a deadline and a default; the client answers with
      `POST .../operations/{id}/reply`. No reply by the deadline means the default applies, which
      is the Java SDK's own default.
    * **One ordered operation lane per session.** Operations run one at a time in submission
      order, exactly as on the Java session's operation thread. `updateInputDisplay` and abort are
      unordered: they overtake the lane because they act on the very operation holding it.
    * **Idempotency.** Every state-changing request under `/v1/sessions` carries an
      `Idempotency-Key`; a replay returns the original response.
    * **Events are the source of truth for state changes.** Each session has an ordered,
      sequence-numbered event stream; a reconnecting client passes `since` and the host replays.

    ## Conventions

    * Money is a decimal string (`"12.34"`, `"-4.00"`), never a float. Timestamps are RFC 3339.
      Durations are ISO 8601 (`PT30S`).
    * Enumerations that mirror a Java enum use the Java constant names (`UPPER_SNAKE`).
      Protocol-level discriminators that have no Java counterpart — session `kind`, host kind,
      operation `type` and `status`, event `type`, widget action `kind` — are lowerCamel or dotted
      lowercase.
    * Errors are a `SessionError` body: a `SessionErrorCode` and a message, plus the Nexo error
      condition and reversal progress when the Java SDK carries them. Three codes exist only on
      the wire (`VALIDATION`, `NOT_FOUND`, `UNAUTHORIZED`); the Java SDK never produces them.

    ## HTTP status mapping

    | Status | Meaning | `code` |
    |---|---|---|
    | 400 | Request validation failed | `VALIDATION` |
    | 401 | Missing or invalid bearer token (reserved; not enforced in development mode) | `UNAUTHORIZED` |
    | 404 | Unknown session, operation, item or widget, or no terminal configured | `NOT_FOUND` |
    | 409 | Lifecycle refusal: the same guards the Java SDK throws `IllegalStateException` for, or a terminal session or a retail-media widget on a host without a terminal or ad decision service | `INVALID_STATE` / `UNSUPPORTED` |
    | 410 | Event replay position no longer buffered | `NOT_FOUND` |
    | 422 | Step reply does not match the pending step, or an `Idempotency-Key` reused with a different body | `INVALID_STATE` / `VALIDATION` |
    | 503 | Terminal unreachable | `NETWORK` |

    ## Authentication

    Development-mode hosts accept unauthenticated requests on loopback. `Authorization: Bearer`
    is reserved: a host that requires it answers 401 with a `SessionError`. Pairing endpoints
    (`/v1/pairing/*`) are reserved for a later revision and are not part of this document.

    ## Versioning

    Hosts advertise the protocol major versions they implement in `GET /health`; this document
    is version `1`. Clients refuse to run against a host that does not list the version they were
    generated from.
