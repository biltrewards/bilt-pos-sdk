    name: Bilt POS SDK
    url: https://github.com/biltrewards/bilt-pos-sdk
  license:
    name: MIT
    identifier: MIT
servers:
  - url: http://127.0.0.1:48333
    description: Terminal Bridge in development mode (loopback)
tags:
  - name: Health
    description: Host discovery, unauthenticated.
  - name: Terminal
    description: The host's one terminal and its session-less device operations, mirroring the Java `Terminal` facade.
  - name: Sessions
    description: Session lifecycle, mirroring `ShopperSession` and `TerminalShopperSession`.
  - name: Basket
    description: The session basket, mirroring `SessionBasket`. Pure local compute on the host.
  - name: Member
    description: The member attached to the visit, mirroring `ShopperSession.member(..)`.
  - name: Context
    description: Checkout phase and attributes, mirroring `SessionContext`.
  - name: Operations
    description: Lazy session operations, their steps, replies and aborts.
  - name: Widgets
    description: Shopper-facing widgets the host runs and the client renders.
  - name: Events
    description: The per-session event stream.
x-tagGroups:
  - name: Host
    tags: [Health, Terminal]
  - name: Session
    tags: [Sessions, Basket, Member, Context]
  - name: Operations
    tags: [Operations, Widgets, Events]
security: []
