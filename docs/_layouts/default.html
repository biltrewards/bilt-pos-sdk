<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title %}{{ page.title }} | {% endif %}{{ site.title }}</title>
  <meta name="description" content="{{ page.description | default: site.description | strip_html | truncatewords: 50 }}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}">
</head>
<body>
  <nav class="site-nav">
    <a href="{{ '/' | relative_url }}" class="nav-brand">
      <div class="nav-brand-logo">B</div>
      <div class="nav-brand-text">Bilt <span>POS SDK</span></div>
    </a>
    <div class="nav-links">
      <a href="{{ '/integration.html' | relative_url }}">Docs</a>
      <a href="{{ '/make-payment.html' | relative_url }}">Payments</a>
      <a href="{{ '/error-scenarios.html' | relative_url }}">Reference</a>
      <a href="https://github.com/niclas-bilt/bilt-pos-sdk" target="_blank">GitHub</a>
    </div>
    <button class="nav-hamburger" onclick="toggleSidebar()" aria-label="Toggle menu">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
        <line x1="3" y1="6" x2="21" y2="6"/>
        <line x1="3" y1="12" x2="21" y2="12"/>
        <line x1="3" y1="18" x2="21" y2="18"/>
      </svg>
    </button>
  </nav>

  {{ content }}

  <script>
    function toggleSidebar() {
      var sidebar = document.querySelector('.sidebar');
      var overlay = document.querySelector('.sidebar-overlay');
      if (sidebar) {
        sidebar.classList.toggle('open');
        if (overlay) overlay.classList.toggle('active');
      }
    }

    document.querySelectorAll('.sidebar-section-title').forEach(function(title) {
      title.addEventListener('click', function() {
        this.parentElement.classList.toggle('collapsed');
      });
    });
  </script>
</body>
</html>
